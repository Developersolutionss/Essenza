<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Essensa — Panel de Manager</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="manager">
    <header>
      <h1>Panel de Manager</h1>
      <p class="sub">Resumen de uso de la plataforma.</p>
    </header>

    <main>
      <section>
        <h2>Uso por chatter</h2>
        <p class="sub">Caracteres generados hoy (sin caché).</p>
        <table>
          <thead>
            <tr><th>Chatter</th><th>Caracteres hoy</th></tr>
          </thead>
          <tbody id="by-chatter"></tbody>
        </table>
      </section>

      <section>
        <h2>Uso por modelo</h2>
        <p class="sub">Caracteres generados este mes (sin caché).</p>
        <table>
          <thead>
            <tr><th>Modelo</th><th>Caracteres este mes</th></tr>
          </thead>
          <tbody id="by-model"></tbody>
        </table>
      </section>

      <section>
        <h2>Nueva modelo</h2>
        <p class="sub">Cargá una modelo nueva sin tocar la base de datos.</p>
        <form id="model-form">
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" placeholder="Nombre de la modelo" required />

          <label for="provider">Proveedor</label>
          <select id="provider" name="provider">
            <option value="elevenlabs">elevenlabs</option>
          </select>

          <label for="voice_id">Voice ID</label>
          <input id="voice_id" name="voice_id" type="text" placeholder="voice_id de ElevenLabs" required />

          <button type="submit">Guardar modelo</button>
          <div id="form-status" class="status"></div>
        </form>
      </section>

      <div id="status" class="status"></div>
    </main>
  </div>

  <script src="/manager.js"></script>
</body>
</html>
